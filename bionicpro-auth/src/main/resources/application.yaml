
server:
  port: ${SERVER_PORT:8084}
logging:
  level:
    org.springframework.security: TRACE

spring:
  application.name: ${APPLICATION_NAME:spring-security-keycloak}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:  ${ISSUER-URI:http://localhost:8086/realms/reports-realm}
      client:
        registration:
          keycloak:
            client-id: reports-realm #reports-frontend
            client-secret: ${CLIENT_SECRET:I5p0EF7hMaDg486dmZeoEBatlNwb7U7X}
            scope: openid, profile
            authorization-grant-type: authorization_code
            redirect-uri: ${REDIRECT-URI:http://localhost:3000}
        provider:
          keycloak:
            issuer-uri: ${ISSUER-URI:http://localhost:8086/realms/reports-realm}
            #user-name-attribute: preferred_username
  data: # For Spring Boot 3.x and newer
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      #password: your_redis_password # Optional, if your Redis instance requires a password
     # database: 0 # Optional, default is 0
      timeout: 60000

keycloak:
  #server-url: http://localhost:8086
  #redirect-uri: http://localhost:8086
  realm: reports-realm
  authServerUrl: ${AUTH_SERVER_URL:http://localhost:8086}

  resource: reports-realm
  credentials:
    provider: secret
    secret: ${CLIENT_SECRET:I5p0EF7hMaDg486dmZeoEBatlNwb7U7X}
    #username: admin1
    #password: admin123
