version: '3.9'

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8086:8080"
    depends_on:
      - keycloak_db

  ldap-server:
    image: osixia/openldap:latest
    container_name: ldap-server
    command: --copy-service
    hostname: ldap-server
    #command: ldapmodify -a -x -D cn=admin -w admin -f /data/config.ldif
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/50-bootstrap.ldif
     # - ./ldap-data/ldap:/var/lib/ldap
     # - ./ldap-data/config:/etc/ldap/slapd.d
    environment:
      LDAP_ORGANISATION: bionicpro_ldap
      LDAP_DOMAIN: bionicproldap.com
      LDAP_ADMIN_PASSWORD: adminadmin
    #restart: unless-stopped
    ports:
      - "389:389"
      - "636:636"

  #frontend1:
    #build:
      #context: ./frontend
      #dockerfile: Dockerfile
    #ports:
     # - "3000:3000"
    #environment:
      #REACT_APP_API_URL: http://localhost:8000
     # REACT_APP_KEYCLOAK_URL: http://localhost:8084
     # REACT_APP_KEYCLOAK_REALM: reports-realm
     # REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend


  postgres16:
    image: postgres:16.0
    volumes:
      - database_data_16:/var/lib/postgresql/data
      - ./dag/sql/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - airflow
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - dag_sample

  bionicpro_db:
    image: postgres:16.0
    volumes:
      - database_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: postgres
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    networks:
      - dag_sample

  report-service:
    build:
      context: ./task2/olap
      dockerfile: Dockerfile
    container_name: report-service
    ports:
      - "8085:80"
    depends_on:
      - postgres16
      - minio
    networks:
      - dag_sample

  olap_db:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9431:9000"
    volumes:
      - ./clickhouse-data:/var/lib/clickhouse
      - ./olap-db:/docker-entrypoint-initdb.d
      - ./olap-db:/var/lib/clickhouse/user_files
      - ./olap-db/users.xml:/etc/clickhouse-server/users.d/users.xml
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks:
      - dag_sample

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    command: server --console-address ":9001" /data
    networks:
      - dag_sample

  nginx-server:
    image: nginx:stable-alpine
    container_name: nginx_reverse_proxy
    ports:
      - "8087:80"
    volumes:
      #- ./html:/usr/share/nginx/html:ro
      # Опционально: монтируйте кастомный конфиг Nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - report-service
    networks:
      - dag_sample
  cdn-edge:
    image: nginx:stable-alpine
    container_name: cdn_edge
    ports:
      - "8089:80" # Проброс порта 8081 хоста для доступа к CDN
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro # Монтирование пользовательского файла конфигурации edge
    depends_on:
      - nginx-server
networks:
  dag_sample:

volumes:
  database_data:
    driver: local
  database_data_16:
    driver: local
  minio_storage: {}

