# nginx/nginx.conf
events {
    worker_connections 1024;
}

http {
    # 1. Определение зоны кэширования
    # Путь: /var/cache/nginx/my_cache_zone
    # Уровни: 1:2 (создает двухуровневую структуру папок для файлов кэша)
    # keys_zone: my_cache_zone:10m (выделяет 10МБ оперативной памяти для хранения ключей кэша)
    # max_size: 1g (максимальный размер дискового кэша 1 ГБ)
    # inactive: 60m (удаляет элементы, к которым не обращались 60 минут)
    # use_temp_path=off (рекомендуется для предотвращения копирования файлов при обновлении кэша)
    proxy_cache_path /var/cache/nginx/my_cache_zone levels=1:2 keys_zone=my_cache_zone:10m
                     max_size=1g inactive=60m use_temp_path=off;

    server {
        listen 80;
        server_name localhost;

        # 2. Настройка проксирования по умолчанию
        location / {
            # Адрес upstream-сервера (замените на ваш реальный backend, например http://my-backend-service)
            proxy_pass http://report-service:8085;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. Отдельная location для кэширования статических файлов
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://report-service:8085;

            # Включение кэширования для этой location
            proxy_cache my_cache_zone;

            # Указание, какие ответы считать валидными и как долго их хранить
            # Кэшировать успешные ответы (200, 301, 302) в течение 24 часов
            proxy_cache_valid 200 301 302 24h;

            # Опционально: Добавление заголовка ответа, чтобы видеть статус кэша (MISS/HIT/EXPIRED)
            add_header X-Proxy-Cache-Status $upstream_cache_status;
        }
    }
}